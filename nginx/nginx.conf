# Alpine: ngx_stream_module vem de nginx-mod-stream.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    log_format lab 'client=$remote_addr request="$request" status=$status upstream=$upstream_addr time=$request_time';
    access_log /dev/stdout lab;

    # Camada 7: HTTP, algoritmos independentes (sem reiniciar NGINX)
    upstream http_rr {
        server server1:8081 max_fails=1 fail_timeout=5s;
        server server2:8082 max_fails=1 fail_timeout=5s;
        server server3:8083 max_fails=1 fail_timeout=5s;
    }
    upstream http_weighted {
        server server1:8081 weight=5;
        server server2:8082 weight=3;
        server server3:8083 weight=1;
    }
    upstream http_least {
        least_conn;
        server server1:8081;
        server server2:8082;
        server server3:8083;
    }
    upstream http_iphash {
        ip_hash;
        server server1:8081;
        server server2:8082;
        server server3:8083;
    }
    server {
        listen 8080;
        add_header Cache-Control "no-store" always;
        location /rr/api/ {
            proxy_pass http://http_rr/api/;
            proxy_set_header X-Lab-Mode rr;
            include /etc/nginx/proxy-common.conf;
        }
        location /weighted/api/ {
            proxy_pass http://http_weighted/api/;
            proxy_set_header X-Lab-Mode weighted;
            include /etc/nginx/proxy-common.conf;
        }
        location /least/api/ {
            proxy_pass http://http_least/api/;
            proxy_set_header X-Lab-Mode least;
            include /etc/nginx/proxy-common.conf;
        }
        location /iphash/api/ {
            proxy_pass http://http_iphash/api/;
            proxy_set_header X-Lab-Mode iphash;
            include /etc/nginx/proxy-common.conf;
        }
        location /api/ {
            proxy_pass http://http_rr/api/;
            proxy_set_header X-Lab-Mode rr;
            include /etc/nginx/proxy-common.conf;
        }
        location /dashboard/api/events {
            proxy_pass http://monitor:7070;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }
        # Não expor pela borda a ingestão interna de eventos.
        location ^~ /internal/ { return 404; }
        location / {
            proxy_pass http://monitor:7070;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
# Camada 4: proxy de conexões TCP e trocas de datagramas UDP
stream {
    upstream tcp_rr {
        server server1:9000;
        server server2:9000;
        server server3:9000;
    }
    upstream tcp_least {
        least_conn;
        server server1:9000;
        server server2:9000;
        server server3:9000;
    }
    upstream tcp_weighted {
        server server1:9000 weight=5;
        server server2:9000 weight=3;
        server server3:9000 weight=1;
    }
    upstream udp_rr {
        server server1:9001;
        server server2:9001;
        server server3:9001;
    }
    server { listen 9090; proxy_pass tcp_rr; proxy_connect_timeout 2s; proxy_timeout 20s; }
    server { listen 9092; proxy_pass tcp_least; proxy_connect_timeout 2s; proxy_timeout 20s; }
    server { listen 9093; proxy_pass tcp_weighted; proxy_connect_timeout 2s; proxy_timeout 20s; }
    server { listen 9091 udp reuseport; proxy_pass udp_rr; proxy_responses 1; proxy_timeout 3s; }
}
